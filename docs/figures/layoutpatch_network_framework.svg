<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect width="1400" height="860" fill="#f7f4ee"/>
  <text x="40" y="46" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" fill="#1d1a16">LayoutPatch full fusion is not built. This is not the current 2-R head.</text>
  <text x="40" y="74" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#6b645c">Redrawn 2026-09-28 from PAPER_SPEC sections 3, 5, 7-9. The old SVG was never committed.</text>
  <g font-family="Microsoft YaHei, SimHei, sans-serif">
    <rect x="30" y="104" width="430" height="250" rx="8" fill="#fff" stroke="#c9b59a"/>
    <text x="48" y="136" font-size="18">1. Encode once</text>
    <rect x="52" y="158" width="160" height="52" rx="6" fill="#efe6d6"/>
    <text x="70" y="190" font-size="15">page image</text>
    <rect x="250" y="158" width="180" height="52" rx="6" fill="#d9e4d4"/>
    <text x="266" y="180" font-size="15">frozen ColPali</text>
    <text x="266" y="200" font-size="13" fill="#4d5648">P: 1024 x 128</text>
    <text x="52" y="246" font-size="14" fill="#6b645c">No crop. No second vision pass.</text>
    <text x="52" y="272" font-size="14" fill="#6b645c">Weights: local vidore/colpali adapter + base.</text>
    <text x="52" y="312" font-size="14" fill="#8a3b2c">Current 2-R stops at patch scores.</text>
    <rect x="485" y="104" width="450" height="250" rx="8" fill="#fff" stroke="#c9b59a"/>
    <text x="503" y="136" font-size="18">2. Layout fusion, not built</text>
    <rect x="506" y="158" width="190" height="64" rx="6" fill="#efe6d6"/>
    <text x="520" y="184" font-size="14">OCR text + box + type</text>
    <text x="520" y="206" font-size="13" fill="#6b645c">project before add</text>
    <rect x="716" y="158" width="190" height="64" rx="6" fill="#e7dfc8"/>
    <text x="730" y="184" font-size="14">T: M layout nodes</text>
    <text x="730" y="206" font-size="13" fill="#6b645c">mask padding</text>
    <rect x="610" y="242" width="220" height="78" rx="6" fill="#d9e4d4"/>
    <text x="626" y="270" font-size="14">W row-norm + TopK</text>
    <text x="626" y="292" font-size="13" fill="#4d5648">p' = p + gate * residual</text>
    <text x="626" y="310" font-size="13" fill="#4d5648">still 1024 patches</text>
    <rect x="960" y="104" width="400" height="250" rx="8" fill="#fff" stroke="#c9b59a"/>
    <text x="978" y="136" font-size="18">3. Retrieval and region score</text>
    <rect x="982" y="158" width="150" height="52" rx="6" fill="#efe6d6"/>
    <text x="1008" y="190" font-size="15">query q</text>
    <rect x="1152" y="158" width="180" height="52" rx="6" fill="#d9e4d4"/>
    <text x="1166" y="180" font-size="14">MaxSim page rank</text>
    <text x="1166" y="200" font-size="12" fill="#4d5648">R@5 / MRR / nDCG</text>
    <rect x="1040" y="230" width="250" height="78" rx="6" fill="#e7dfc8"/>
    <text x="1056" y="260" font-size="14">rerank boxes on gold page</text>
    <text x="1056" y="282" font-size="13" fill="#6b645c">Area@1 / Area@5</text>
    <text x="1056" y="300" font-size="13" fill="#6b645c">vs fixed:iou_mass</text>
    <rect x="30" y="378" width="1330" height="210" rx="8" fill="#fff" stroke="#c9b59a"/>
    <text x="48" y="410" font-size="18">What is running now: 2-R, not the three panels above</text>
    <rect x="52" y="432" width="300" height="124" rx="6" fill="#efe6d6"/>
    <text x="68" y="464" font-size="15">frozen ColPali</text>
    <text x="68" y="490" font-size="14" fill="#6b645c">cached page vectors</text>
    <text x="68" y="514" font-size="14" fill="#6b645c">patch scores pooled onto boxes</text>
    <rect x="376" y="432" width="300" height="124" rx="6" fill="#efe6d6"/>
    <text x="392" y="464" font-size="15">frozen bge-m3</text>
    <text x="392" y="490" font-size="14" fill="#6b645c">query text vector</text>
    <text x="392" y="514" font-size="14" fill="#6b645c">OCR box text, empty = 0</text>
    <rect x="700" y="432" width="250" height="124" rx="6" fill="#e7dfc8"/>
    <text x="716" y="464" font-size="15">box geometry</text>
    <text x="716" y="490" font-size="14" fill="#6b645c">area, page fraction</text>
    <text x="716" y="514" font-size="14" fill="#6b645c">center x, y</text>
    <rect x="974" y="432" width="350" height="124" rx="6" fill="#d9e4d4"/>
    <text x="990" y="464" font-size="15">only trainable w, b</text>
    <text x="990" y="490" font-size="14" fill="#4d5648">s(c) = w dot x_c + b</text>
    <text x="990" y="514" font-size="14" fill="#4d5648">page order stays frozen ColPali</text>
    <rect x="30" y="612" width="1330" height="214" rx="8" fill="#fff" stroke="#c9b59a"/>
    <text x="48" y="646" font-size="18">Hard constraints</text>
    <text x="52" y="680" font-size="15">C1: no crop, no extra vision encode.</text>
    <text x="52" y="708" font-size="15">C2: patch count stays 1024. MaxSim interface stays.</text>
    <text x="52" y="736" font-size="15">C3: if fusion is built, it is offline and query-independent.</text>
    <text x="52" y="770" font-size="15" fill="#8a3b2c">Do not build fusion/. Do not write train_fusion.py. test_eval is not scored.</text>
    <text x="52" y="798" font-size="15" fill="#6b645c">Original pixels cannot be restored. This file is a new drawing, not a git checkout.</text>
  </g>
</svg>
